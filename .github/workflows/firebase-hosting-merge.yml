name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install application dependencies
        run: npm ci
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Verify application and Functions
        run: npm run typecheck && npm run lint && npm test && npm run test:functions && npm run test:firestore && npm run build
      - name: Authenticate Firebase deployment
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MONSTER_MANIA_AEA35 }}
      - name: Report authenticated deployment principal
        run: node -e "const fs=require('node:fs'); const key=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')); console.log('Authenticated principal:', key.client_email)"
      - name: Deploy Functions, Firestore rules, and indexes
        run: npx --no-install firebase deploy --only functions,firestore:rules,firestore:indexes --project monster-mania-aea35 --non-interactive
      - uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MONSTER_MANIA_AEA35 }}
          firebaseToolsVersion: 15.30.0
          channelId: live
          projectId: monster-mania-aea35
